                      "tertiary-fixed-dim": "#c0c6d9",
                      "inverse-surface": "#e0e2ec",

<style>
        .dashed-separator {
            border-bottom: 1px dashed rgba(139, 146, 163, 0.3);
        }
        .ghost-border {
            border: 1px solid rgba(139, 146, 163, 0.2);
        }
        .scanning-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(232, 163, 61, 0.8);
            box-shadow: 0 0 10px rgba(232, 163, 61, 0.5);
            animation: scan 2s linear infinite;
            display: none;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
      </style>
</head>
<body class="bg-background text-on-surface font-body-md text-body-md antialiased min-h-screen flex items-center justify-center p-md">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-background/80 backdrop-blur-sm z-40 flex items-center justify-center p-4">
<!-- Create Post Modal Card -->
<div class="bg-[#1B1F29] ghost-border rounded-card w-full max-w-lg relative overflow-hidden flex flex-col shadow-2xl">
<div class="scanning-loader z-50" id="loader"></div>
<!-- Header -->
<div class="px-md py-sm dashed-separator flex items-center justify-between">
<h2 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Create Post</h2>
<button aria-label="Close" class="text-on-surface-variant hover:text-on-surface transition-colors p-1">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Content Area -->
<div class="p-md flex flex-col gap-md">
<!-- Text Area -->
<div class="relative group">
<textarea class="w-full bg-background ghost-border rounded-DEFAULT p-sm text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary-container transition-colors resize-none h-32 placeholder:text-on-surface-variant/50" id="postContent" placeholder="What's on your ledger today?"></textarea>
</div>
<!-- Media Upload / Actions -->
<div class="flex items-center gap-sm">
<button class="flex items-center gap-xs px-sm py-xs border border-outline-variant/30 text-on-surface-variant rounded-DEFAULT hover:border-primary-container/50 hover:text-primary-container transition-colors font-mono-label text-mono-label">
<span class="material-symbols-outlined text-[16px]" data-icon="image">image</span>
                        ADD MEDIA
                    </button>
<button class="flex items-center gap-xs px-sm py-xs border border-outline-variant/30 text-on-surface-variant rounded-DEFAULT hover:border-primary-container/50 hover:text-primary-container transition-colors font-mono-label text-mono-label">
<span class="material-symbols-outlined text-[16px]" data-icon="gif_box">gif_box</span>
                        ADD GIF
                    </button>
</div>
<!-- Financial Data / Status -->
<div class="bg-surface-container-low rounded-DEFAULT p-sm flex flex-col gap-xs mt-sm ghost-border">
<div class="flex justify-between items-center dashed-separator pb-xs">
<span class="font-mono-label text-mono-label text-on-surface-variant">FEE ESTIMATE</span>
<div class="flex items-center gap-xs">
<span class="bg-[#3FA796] text-white px-2 py-0.5 rounded font-mono-label text-[10px] tracking-wider uppercase font-bold">Posting Fee: 2 $XMS</span>
</div>
</div>
<div class="flex justify-between items-center pt-xs">
<span class="font-mono-label text-mono-label text-on-surface-variant">GAS: 0.0012 ETH</span>
<div class="flex items-center gap-xs text-on-surface">
<span class="material-symbols-outlined text-[14px]" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-mono-data text-mono-data">BAL: 1,450.50 $XMS</span>
</div>
</div>
</div>
</div>
<!-- Footer / Submit -->
<div class="px-md py-sm dashed-separator flex items-center justify-end gap-sm bg-surface-container-lowest">
<button class="px-sm py-xs text-on-surface-variant hover:text-on-surface transition-colors font-body-md text-body-md">
                    Cancel
                </button>
<button class="bg-primary-container text-background px-md py-xs rounded-DEFAULT font-headline-sm text-[16px] font-medium hover:brightness-105 active:scale-98 transition-all flex items-center gap-xs" id="submitBtn">
                    Broadcast
                    <span class="material-symbols-outlined text-[18px]" data-icon="send">send</span>
</button>
</div>
</div>
</div>
<script>
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const textarea = document.getElementById('postContent');

        submitBtn.addEventListener('click', () => {
            if(!textarea.value.trim()) {
                textarea.classList.add('border-error');
                setTimeout(() => textarea.classList.remove('border-error'), 500);
                return;
            }
            
            // Simulate loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            submitBtn.innerHTML = 'Broadcasting... <span class="material-symbols-outlined text-[18px] animate-spin" data-icon="sync">sync</span>';
            loader.style.display = 'block';

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                submitBtn.innerHTML = 'Broadcast <span class="material-symbols-outlined text-[18px]" data-icon="send">send</span>';
                loader.style.display = 'none';
                textarea.value = '';
            }, 2000);
        });
    </script>
</body></html>
